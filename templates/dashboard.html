<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>减肥看板</title>
<style>
/* Impact 只有一个字重，声明成 900 防止浏览器再给它描粗。手机上没有 Impact：iOS 落到 Helvetica Neue 窄黑体，安卓落到 Roboto 窄粗体。sans-serif-condensed 要排在安卓认识的其他字体名前面 */
@font-face { font-family: Big; font-weight: 900; src: local("Impact"); }
:root {
  color-scheme: light;
  --paper: #f6f0e3; --ink: #111111; --ink2: #4a453c; --ink3: #6d675b; --rule: #d9d1bf;
  --red: #ff3a12; --sun: #ffe11a; --cream: #fff8ea;
  --big: Big, "HelveticaNeue-CondensedBlack", "sans-serif-condensed", "Arial Narrow", "PingFang SC", "Microsoft YaHei", sans-serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
html { scrollbar-width: none; }

.page { display: grid; grid-template-columns: minmax(0, 1fr); }
.cjk { font-family: var(--sans); font-weight: 900; font-size: .78em; margin-right: .12em; }

/* 左边红色大版面 */
.hero { position: relative; background: var(--red); color: var(--ink); padding: 18px 18px 22px; overflow: hidden; display: flex; flex-direction: column; gap: 10px; animation: wipeDown .55s cubic-bezier(.8,0,.1,1) both; }
@keyframes wipeDown { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
.kicker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 800; font-size: 16px; padding-right: 120px; }
.kicker b { background: var(--ink); color: var(--cream); padding: 2px 10px; font-weight: 800; }
.chip { background: var(--cream); padding: 2px 8px; font-size: 13px; font-weight: 700; white-space: nowrap; }
button { font: 700 13px var(--sans); background: var(--ink); color: var(--cream); border: 0; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.still { font-size: 44px; font-weight: 900; line-height: 1; margin-top: 8px; animation: slam .45s cubic-bezier(.2,1.4,.4,1) .35s both; }
.giant { display: flex; align-items: flex-end; font-family: var(--big); font-weight: 900; color: var(--cream); line-height: .95; animation: punch 5s ease-out 4s infinite; transform-origin: left bottom; }
@keyframes punch { 0%, 88%, 100% { transform: scale(1); } 92% { transform: scale(1.07) rotate(-1.2deg); } 96% { transform: scale(.98) rotate(.5deg); } }
#togo { font-size: var(--size, 196px); display: inline-flex; filter: drop-shadow(7px 7px 0 var(--ink)); }
.giant em { font-style: normal; font-size: 56px; margin: 0 0 16px 12px; color: var(--ink); }
.col { display: inline-block; height: 1em; overflow: hidden; line-height: 1; }
.reel { display: block; animation: roll 1.6s cubic-bezier(.15,.8,.2,1) both; animation-delay: var(--d); }
.reel span { display: block; height: 1em; text-align: center; }
@keyframes roll { from { transform: translateY(0); } to { transform: translateY(calc(var(--n) * -1em)); } }
.reel.done, .reel { transform: translateY(calc(var(--n) * -1em)); }
@keyframes slam { from { transform: scale(2.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* 进度尺 */
.ruler { display: grid; gap: 6px; font-weight: 800; font-size: 16px; }
.track { position: relative; height: 34px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 20px); border-bottom: 5px solid var(--ink); }
.fill { position: absolute; left: 0; top: 6px; bottom: 0; width: var(--pct); background: repeating-linear-gradient(-45deg, var(--cream) 0 12px, var(--sun) 12px 24px); background-size: 200% 100%; border: 3px solid var(--ink); border-bottom: 0; animation: fill 1.6s cubic-bezier(.2,1,.3,1) .9s both, barber 1.2s linear 2.6s infinite; }
@keyframes fill { from { width: 0; } }
@keyframes barber { to { background-position: -34px 0; } }
.ends { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* 旋转徽章 */
.badge { position: absolute; right: 12px; top: 10px; width: 120px; height: 120px; animation: stamp .5s cubic-bezier(.2,1.6,.4,1) 1.5s both; }
.badge svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 7s linear infinite; }
.badge svg text { font: 800 17px var(--sans); fill: var(--cream); letter-spacing: 1px; }
.badge::before { content: ""; position: absolute; inset: 0; background: var(--ink); border-radius: 50%; }
.badge b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 900 38px var(--big); color: var(--sun); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes stamp { from { transform: scale(3) rotate(-30deg); opacity: 0; } }

/* 胶带跑马灯 */
.tape { margin: 8px -40px; transform: rotate(-2.4deg); background: var(--sun); border-block: 4px solid var(--ink); overflow: hidden; white-space: nowrap; font-weight: 900; font-size: 20px; padding: 6px 0; animation: tapeIn .5s cubic-bezier(.2,1,.3,1) 1.2s both; }
.tape > div { display: inline-block; animation: tick 16s linear infinite; }
@keyframes tick { to { transform: translateX(-50%); } }
@keyframes tapeIn { from { transform: rotate(-2.4deg) translateX(-110%); } }

/* 每天的三个数字 */
.daily { display: grid; gap: 2px; background: var(--ink); color: var(--cream); padding: 12px 14px; animation: wipeRight .5s cubic-bezier(.8,0,.1,1) 1.4s both; margin-top: auto; }
.daily .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.daily .row > span { font-size: 17px; font-weight: 700; white-space: nowrap; }
.daily b { font: 900 50px/1.08 var(--big); color: var(--sun); white-space: nowrap; display: inline-flex; align-items: baseline; }
.daily b small { font: 900 22px var(--big); color: var(--cream); margin-left: 7px; }
@keyframes wipeRight { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

/* 右边 */
.right { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; min-height: 0; }
.block { padding: 14px 16px; border-bottom: 5px solid var(--ink); min-width: 0; min-height: 0; animation: wipeRight .6s cubic-bezier(.8,0,.1,1) both; animation-delay: var(--t, .4s); }
figure { margin: 0; display: flex; flex-direction: column; }
h2 { margin: 0 0 6px; display: flex; align-items: baseline; justify-content: flex-start; gap: 10px; flex-wrap: wrap; font-size: 32px; font-weight: 900; line-height: 1.1; }
h2 small { font-size: 14px; font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 13px; font-weight: 700; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; width: 18px; height: 0; border-top: 5px solid var(--ink); }
.key.dash { border-top: 3px dashed var(--ink3); }
.key.dot { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--red); }
.plot { position: relative; height: 270px; touch-action: pan-y; }
.black { background: var(--ink); color: var(--cream); }
.black .plot { height: 180px; }
svg.chart { display: block; outline: none; overflow: visible; }
.tl { font: 700 12px var(--sans); fill: var(--ink3); }
.black .tl { fill: #cfc7b3; }
.draw { stroke-dasharray: 1; animation: draw 1.9s cubic-bezier(.5,0,.3,1) 1s both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.pop { animation: pop .28s cubic-bezier(.2,2.4,.4,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { transform: scale(0); } }
.ripple { fill: none; transform-box: fill-box; transform-origin: center; animation: ripple 1.4s ease-out infinite; }
@keyframes ripple { from { transform: scale(.4); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
.tip { position: absolute; top: 2px; left: 0; pointer-events: none; background: var(--ink); color: var(--cream); border: 2px solid var(--sun); padding: 7px 10px; font-size: 13px; white-space: nowrap; display: none; z-index: 3; max-width: 260px; }
.tip b { font-weight: 800; margin-right: 6px; }
.tip div { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.tip .date { margin: 0 0 2px; color: #cfc7b3; }
.tip .note { white-space: normal; }
.tip .key { border-top-color: var(--sun); }
.tip .key.dash { border-top-color: #cfc7b3; }
.none { display: flex; height: 100%; align-items: center; justify-content: center; text-align: center; padding: 12px; font-weight: 700; color: var(--ink3); border: 3px dashed var(--ink3); }
.black .none { color: #cfc7b3; border-color: #6d675b; }
.seg { display: inline-flex; border: 3px solid var(--ink); }
.seg button { min-height: 44px; padding: 0 14px; font-size: 16px; font-weight: 900; background: var(--cream); color: var(--ink); border-right: 3px solid var(--ink); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sun); }
.stats { display: grid; grid-template-columns: 1fr 1fr; }
.stat { padding: 10px 14px; border-right: 5px solid var(--ink); border-bottom: 5px solid var(--ink); animation: stamp .4s cubic-bezier(.2,1.4,.4,1) both; animation-delay: var(--t); min-width: 0; }
.stat:nth-child(2n) { border-right: 0; }
.stat:nth-last-child(-n+2) { border-bottom: 0; }
.stat .k { font-size: 15px; font-weight: 800; }
.stat .v { font: 900 46px/1.1 var(--big); white-space: nowrap; display: inline-flex; align-items: baseline; }
.stat .v small { font-size: 20px; margin-left: 5px; }
.stat .s { font-size: 13px; color: var(--ink2); font-weight: 700; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr); }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; border: 4px solid var(--ink); }
.day { padding: 7px 0; text-align: center; font-weight: 900; font-size: 17px; border-right: 4px solid var(--ink); animation: dayIn .35s cubic-bezier(.2,1.6,.4,1) both; animation-delay: calc(var(--n) * 90ms + 1.5s); min-width: 0; }
.day:last-child { border-right: 0; }
.day i { display: block; font-style: normal; font-size: 14px; font-weight: 800; min-height: 20px; white-space: nowrap; }
.day.on { background: var(--red); color: var(--cream); animation: dayIn .35s cubic-bezier(.2,1.6,.4,1) both, nudge 1.6s ease-in-out infinite; animation-delay: calc(var(--n) * 90ms + 1.5s), 3s; }
.day.today { box-shadow: inset 0 0 0 4px var(--sun); }
@keyframes dayIn { from { transform: translateY(-120%); opacity: 0; } }
@keyframes nudge { 50% { transform: translateY(-5px); } }
.raw-plan { font-size: 22px; font-weight: 800; }
.focus { background: var(--sun); position: relative; }
.focus p { margin: 0; font-size: 25px; font-weight: 900; line-height: 1.32; animation: slamSmall .5s cubic-bezier(.2,1.4,.4,1) 2.2s both, wobble 3.4s ease-in-out 3s infinite; transform-origin: left center; }
@keyframes slamSmall { from { transform: scale(1.8); opacity: 0; } }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-.8deg) scale(1.012); } }
.foot { font-size: 12px; font-weight: 600; color: var(--ink2); padding: 6px 16px; text-align: center; }
.foot a { color: var(--ink); margin-left: 8px; }
details { padding: 8px 16px 20px; }
summary { cursor: pointer; font-size: 14px; font-weight: 700; }
.scroll { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 12px 5px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; font-variant-numeric: tabular-nums; }
td:last-child { white-space: normal; min-width: 120px; }
.nodata { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 26px; font-weight: 900; line-height: 1.5; padding: 24px; background: var(--red); }

@media (min-width: 1000px) {
  .page { grid-template-columns: 580px minmax(0, 1fr); height: 100vh; min-height: 930px; }
  .hero { padding: 24px 28px 26px; gap: 12px; }
  .kicker { font-size: 19px; padding-right: 150px; }
  .chip { font-size: 15px; }
  .badge { width: 158px; height: 158px; right: 20px; top: 18px; }
  .badge b { font-size: 52px; }
  .still { font-size: 70px; margin-top: 26px; }
  #togo { font-size: var(--size, 300px); }
  #togo { filter: drop-shadow(10px 10px 0 var(--ink)); }
  .giant em { font-size: 88px; margin-bottom: 26px; }
  .ruler { font-size: 20px; }
  .track { height: 44px; }
  .tape { font-size: 26px; padding: 8px 0; margin: 12px -60px; }
  .daily { padding: 14px 20px; }
  .daily .row > span { font-size: 20px; }
  .daily b { font-size: 56px; }
  .daily b small { font-size: 26px; }
  .right { grid-template-rows: minmax(0, 1.55fr) minmax(0, 1fr) auto auto; height: 100vh; min-height: 930px; }
  .right > .block, .right > .pair { min-height: 0; }
  .plot, .black .plot { flex: 1; height: auto; min-height: 0; }
  h2 { font-size: 40px; }
  h2 small { font-size: 16px; }
  .legend { font-size: 16px; }
  .tl { font-size: 15px; }
  .pair { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pair .black { border-bottom: 5px solid var(--ink); }
  .pair .stats { border-bottom: 5px solid var(--ink); }
  .stat { padding: 8px 16px; display: flex; flex-direction: column; justify-content: center; }
  .stat .k { font-size: 18px; }
  .stat .v { font-size: 60px; }
  .stat .v small { font-size: 26px; }
  .stat .s { font-size: 15px; }
  .lower { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  .lower .block { border-bottom: 0; }
  .lower .block:first-child { border-right: 5px solid var(--ink); }
  .day { font-size: 20px; padding: 12px 0; }
  .day i { font-size: 16px; }
  .focus p { font-size: 28px; }
  .foot { padding: 4px 16px; border-top: 5px solid var(--ink); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>
</head>
<body>
<div id="nodata" class="nodata" hidden>还没有数据。<br>对你的 Agent 说「开始减肥计划」，走完问答再回来看。</div>
<main id="app" class="page" hidden>
  <aside class="hero">
    <div class="kicker"><b id="weekno"></b><span>减肥看板</span><span id="chip" class="chip" hidden>示例数据，全部是编的</span><button id="replay" type="button">再放一遍</button></div>
    <div class="badge" id="badge">
      <svg viewBox="0 0 160 160" aria-hidden="true"><defs><path id="around" d="M80 80m-60 0a60 60 0 1 1 120 0a60 60 0 1 1 -120 0"/></defs><text><textPath href="#around" id="aroundText"></textPath></text></svg>
      <b id="lost"></b>
    </div>
    <div class="still">离目标还差</div>
    <div class="giant"><span id="togo"></span><em>KG</em></div>
    <div class="ruler">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="ends"><span id="from"></span><span id="pct"></span><span id="to"></span></div>
    </div>
    <div class="tape"><div id="tape"></div></div>
    <div class="daily">
      <div class="row"><span>每天热量</span><b id="kcal"></b></div>
      <div class="row"><span>每天蛋白</span><b id="protein"></b></div>
      <div class="row"><span>每天步数</span><b id="steps"></b></div>
    </div>
  </aside>

  <div class="right">
    <figure class="block" style="--t:.45s">
      <h2>体重 <small>KG</small><span class="seg" role="group" aria-label="时间段"><button type="button" data-unit="day" aria-pressed="true">按天</button><button type="button" data-unit="week" aria-pressed="false">按周</button><button type="button" data-unit="month" aria-pressed="false">按月</button></span><span class="legend" style="margin-left:auto"><span id="legDot"><i class="key dot"></i>每天</span><span><i class="key"></i><span id="legLine">7 天平均</span></span><span><i class="key dash"></i>计划线</span></span></h2>
      <div class="plot" id="weight"></div>
    </figure>
    <div class="pair">
      <figure class="block black" style="--t:.7s">
        <h2>腰围 <small>CM</small></h2>
        <div class="plot" id="waist"></div>
      </figure>
      <section class="stats">
        <div class="stat" style="--t:1.1s"><div class="k" id="k1"></div><div class="v" id="t1"></div><div class="s" id="t1s"></div></div>
        <div class="stat" style="--t:1.25s"><div class="k" id="k2"></div><div class="v" id="t2"></div><div class="s" id="t2s"></div></div>
        <div class="stat" style="--t:1.4s"><div class="k" id="k3"></div><div class="v" id="t3"></div><div class="s" id="t3s"></div></div>
        <div class="stat" style="--t:1.55s"><div class="k" id="k4"></div><div class="v" id="t4"></div><div class="s" id="t4s"></div></div>
      </section>
    </div>
    <div class="lower">
      <section class="block" style="--t:1s">
        <h2 style="font-size:26px">力量训练 <small id="split"></small></h2>
        <div id="train"></div>
      </section>
      <section class="block focus" style="--t:1.15s">
        <h2 style="font-size:26px">这周重点</h2>
        <p id="focus"></p>
      </section>
    </div>
    <footer class="foot">AI 判断不准，不是医疗建议。数据只存在你自己的电脑上。<a id="openraw" href="#raw">看每天的原始数据</a></footer>
  </div>
</main>
<details id="raw" hidden>
  <summary>看每天的原始数据</summary>
  <div class="scroll"><table><thead><tr><th>日期</th><th>体重</th><th>7 天平均</th><th>计划线</th><th>腰围</th><th>备注</th></tr></thead><tbody id="rows"></tbody></table></div>
</details>

<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const STILL = matchMedia("(prefers-reduced-motion: reduce)").matches;
const dayNo = (s) => Date.parse(s + "T00:00:00Z") / 864e5;
const fmt = (x, n = 1) => x === null || x === undefined ? "—" : Number(x).toFixed(n);
const signed = (x, n = 1) => { if (x === null || x === undefined) return "—"; const r = +x.toFixed(n); return (r < 0 ? "−" : r > 0 ? "+" : "") + Math.abs(r).toFixed(n); };
const md = (s) => +s.slice(5, 7) + "/" + +s.slice(8, 10);
const WEEK = "日一二三四五六";

// 数字：老虎机，每一位是一条竖着滚的数字带，停在目标数字上
function slot(el, text, unit, delay = 0) {
  el.replaceChildren();
  el.setAttribute("aria-label", text + (unit || ""));
  [...text].forEach((c, i) => {
    if (!/\d/.test(c) || STILL) { const s = document.createElement("span"); s.textContent = c; if (/[\u4e00-\u9fff]/.test(c)) s.className = "cjk"; el.append(s); return; }
    const col = document.createElement("span"), reel = document.createElement("span"), turns = 12 + i * 3;
    col.className = "col"; reel.className = "reel";
    for (let n = 0; n <= turns; n++) { const d = document.createElement("span"); d.textContent = (+c + n - turns + 100) % 10; reel.append(d); }
    reel.style.setProperty("--n", turns); reel.style.setProperty("--d", `${delay + i * 130}ms`);
    col.append(reel); el.append(col);
  });
  if (unit) { const s = document.createElement("small"); s.textContent = unit; el.append(s); }
}

function niceStep(range, maxTicks) {
  for (const s of [0.5, 1, 2, 5, 10, 20, 50]) if (range / s <= maxTicks) return s;
  return 100;
}

// 备注只经 textContent 进页面，SVG 字符串里只有数字和日期
function chart(host, cfg, animate) {
  const W = host.clientWidth, H = host.clientHeight, big = innerWidth >= 1000;
  const m = { l: big ? 46 : 36, r: big ? 70 : 54, t: 12, b: big ? 26 : 22 };
  const pts = cfg.points, slots = DATA.views[cfg.unit];
  if (!pts.some((p) => p.y !== null && p.y !== undefined)) {
    const n = document.createElement("div"); n.className = "none"; n.textContent = cfg.emptyText;
    return host.replaceChildren(n);
  }
  const x0 = dayNo(slots[0].d), x1 = dayNo(slots[slots.length - 1].d), span = x1 - x0;
  const X = (d) => m.l + (dayNo(d) - x0) / Math.max(1, span) * (W - m.l - m.r);
  const all = pts.flatMap((p) => [p.y, p.a, p.p]).filter((v) => v !== null && v !== undefined);
  const spreadAll = Math.max(...all) - Math.min(...all);
  const near = cfg.target !== undefined && cfg.target >= Math.min(...all) - Math.max(spreadAll, 1) * 0.6;
  if (near) all.push(cfg.target);
  const step = Math.max(niceStep(Math.max(...all) - Math.min(...all), big ? 6 : 4), cfg.minStep || 0);
  const lo = Math.floor((Math.min(...all) - step * 0.25) / step) * step;
  const hi = Math.ceil((Math.max(...all) + step * 0.25) / step) * step;
  const Y = (v) => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const path = (key) => pts.filter((p) => p[key] !== null && p[key] !== undefined).map((p, i) => `${i ? "L" : "M"}${X(p.d).toFixed(1)} ${Y(p[key]).toFixed(1)}`).join("");
  const line = cfg.lineKey, withLine = pts.filter((p) => p[line] !== null && p[line] !== undefined);
  const start = cfg.start, dur = start ? 1900 : 800, delayAt = (d) => start + (dayNo(d) - x0) / Math.max(1, span) * dur;

  let g = `<defs><clipPath id="${host.id}-cp"><rect x="0" y="0" width="${animate ? 0 : W}" height="${H}">${animate ? `<animate attributeName="width" from="0" to="${W}" begin="${start}ms" dur="${dur}ms" fill="freeze"/>` : ""}</rect></clipPath></defs>`;
  for (let v = lo; v <= hi + 1e-9; v += step) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${cfg.gridColor}"/>`;
    g += `<text class="tl" x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${+v.toFixed(1)}</text>`;
  }
  let every = 7;
  while (every / Math.max(1, span) * (W - m.l - m.r) < 52 && every < span) every *= 2;
  const marks = [];
  if (cfg.unit === "month") {
    const gap = Math.ceil(52 * Math.max(1, slots.length - 1) / (W - m.l - m.r));
    slots.forEach((p, i) => { if (i % gap === 0) marks.push(p.d); });
  } else for (let n = 0; n <= span; n += every) marks.push(new Date((x0 + n) * 864e5).toISOString().slice(0, 10));
  marks.forEach((d) => { g += `<text class="tl" x="${X(d)}" y="${H - 5}" text-anchor="middle">${cfg.unit === "month" ? +d.slice(5, 7) + "月" : md(d)}</text>`; });
  if (cfg.target !== undefined) {
    g += near
      ? `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(cfg.target)}" y2="${Y(cfg.target)}" stroke="var(--ink)" stroke-width="2"/><text class="tl" x="${m.l + 8}" y="${Y(cfg.target) - 6}">目标 ${cfg.target.toFixed(1)}</text>`
      : `<text class="tl" x="${m.l + 8}" y="${H - m.b - 8}">↓ 目标 ${cfg.target.toFixed(1)}</text>`;
  }
  if (cfg.plan) g += `<path clip-path="url(#${host.id}-cp)" d="${path("p")}" fill="none" stroke="var(--ink3)" stroke-width="3" stroke-dasharray="9 8"/>`;
  let dots = "";
  if (cfg.dots) pts.forEach((p) => {
    if (p.y !== null && p.y !== undefined) dots += `<circle ${animate ? `class="pop" style="animation-delay:${delayAt(p.d)}ms"` : ""} cx="${X(p.d)}" cy="${Y(p.y)}" r="${big ? 6 : 4.5}" fill="${cfg.dotColor}" stroke="${cfg.surface}" stroke-width="2"/>`;
  });
  if (line !== "y") g += dots;  // 按天时点是散的，垫在 7 天平均线下面；按周按月点就在线上，要盖在线上才看得见
  g += `<path ${animate ? `class="draw" pathLength="1" style="animation-delay:${start}ms;animation-duration:${dur}ms"` : ""} d="${path(line)}" fill="none" stroke="${cfg.color}" stroke-width="${big ? 6 : 4.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (line === "y") g += dots;
  const end = withLine[withLine.length - 1];
  if (end) {
    const ex = X(end.d), ey = Y(end[line]), label = end[line].toFixed(1), bw = big ? 62 : 46, bh = big ? 30 : 24;
    if (!STILL) g += `<circle class="ripple" cx="${ex}" cy="${ey}" r="10" stroke="${cfg.dotColor}" stroke-width="3"/>`;
    g += `<circle cx="${ex}" cy="${ey}" r="8" fill="${cfg.color}" stroke="${cfg.surface}" stroke-width="2"/>`;
    g += `<rect x="${ex + 11}" y="${ey - bh / 2}" width="${bw}" height="${bh}" fill="${cfg.color}"/><text x="${ex + 11 + bw / 2}" y="${ey + (big ? 7 : 6)}" text-anchor="middle" fill="${cfg.surface}" font-family="var(--big)" font-weight="900" font-size="${big ? 22 : 17}">${label}</text>`;
  }
  g += `<line class="cross" y1="${m.t}" y2="${H - m.b}" stroke="${cfg.dotColor}" stroke-width="2" visibility="hidden"/>`;
  g += `<circle class="mark" r="7" fill="${cfg.color}" stroke="${cfg.surface}" stroke-width="2" visibility="hidden"/>`;

  host.innerHTML = `<svg class="chart" width="${W}" height="${H}" tabindex="0" role="img" aria-label="${cfg.aria}">${g}</svg><div class="tip"></div>`;
  const svg = host.querySelector("svg"), tip = host.querySelector(".tip"), cross = svg.querySelector(".cross"), mark = svg.querySelector(".mark");
  let cur = pts.length - 1;
  const show = (i) => {
    cur = i;
    const p = pts[i], px = X(p.d), mv = p[line] ?? p.y ?? p.p;
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    if (mv !== null && mv !== undefined) { mark.setAttribute("cx", px); mark.setAttribute("cy", Y(mv)); mark.setAttribute("visibility", "visible"); }
    const date = document.createElement("div"); date.className = "date";
    date.textContent = cfg.unit === "day" ? `${md(p.d)} 周${WEEK[new Date(p.d + "T00:00:00Z").getUTCDay()]}` : cfg.unit === "week" ? `${md(p.d)}–${md(p.to)}` : `${p.d.slice(0, 4)} 年 ${+p.d.slice(5, 7)} 月`;
    tip.replaceChildren(date);
    cfg.rows.forEach(([key, name, cls]) => {
      if (p[key] === null || p[key] === undefined) return;
      const row = document.createElement("div"), b = document.createElement("b"), k = document.createElement("i"), t = document.createElement("span");
      b.textContent = p[key].toFixed(1); k.className = "key " + cls; t.textContent = name; row.append(k, b, t); tip.append(row);
    });
    const note = p.c ? `记了 ${p.c} 天` : p.n;
    if (note) { const n = document.createElement("div"); n.className = "note"; n.textContent = note; tip.append(n); }
    tip.style.display = "block";
    tip.style.left = (px + 14 + tip.offsetWidth > W ? Math.max(0, px - tip.offsetWidth - 14) : px + 14) + "px";
  };
  const hide = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); mark.setAttribute("visibility", "hidden"); };
  const nearest = (ev) => {
    const px = ev.clientX - svg.getBoundingClientRect().left;
    let best = 0, dist = Infinity;
    pts.forEach((p, i) => { const d = Math.abs(X(p.d) - px); if (d < dist) { dist = d; best = i; } });
    show(best);
  };
  svg.addEventListener("pointermove", nearest); svg.addEventListener("pointerdown", nearest); svg.addEventListener("pointerleave", hide);
  svg.addEventListener("focus", () => show(cur)); svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", (ev) => { if (ev.key === "ArrowLeft") show(Math.max(0, cur - 1)); if (ev.key === "ArrowRight") show(Math.min(pts.length - 1, cur + 1)); });
}

let unit = "day";  // 按天 day、按周 week、按月 month

function render(animate, start = 1000) {
  const s = DATA.stats, day = unit === "day", name = unit === "week" ? "周" : "月";
  const pts = DATA.views[unit];  // 还没到的格子没有 w、v 字段，下面的过滤会留下它们，横轴才画得到后面
  $("legDot").hidden = !day;
  $("legLine").textContent = day ? "7 天平均" : `每${name}平均`;
  chart($("weight"), {
    unit, start,
    points: pts.filter((p) => p.w !== null).map((p) => ({ ...p, y: p.w })),
    lineKey: day ? "a" : "y", color: "#111111", dotColor: "#ff3a12", surface: "#f6f0e3", gridColor: "#d9d1bf", dots: true, plan: true, target: s.target,
    aria: `体重曲线，${day ? "每天和 7 天平均" : `每${name}平均`}，目标 ${s.target} kg。每天的数值见页面底部表格。`,
    rows: day ? [["a", "7 天平均", ""], ["y", "当天", "dot"], ["p", "计划线", "dash"]] : [["y", `这${name}平均`, ""], ["p", "计划线", "dash"]],
  }, animate);
  chart($("waist"), {
    unit, start,
    points: pts.filter((p) => p.v !== null).map((p) => ({ ...p, y: p.v, a: null, p: null })),
    lineKey: "y", color: "#ffe11a", dotColor: "#ffe11a", surface: "#111111", gridColor: "#3a372f", dots: true, minStep: 1,
    aria: `腰围曲线，最新 ${s.waist ?? "暂无"} cm。每次的数值见页面底部表格。`,
    rows: [["y", day ? "腰围" : `这${name}平均`, ""]],
    emptyText: "还没量腰围。量了告诉 Agent，这里就有点",
  }, animate);
}

const gapText = (g) => g === null ? ["—", ""] : Math.abs(g) < 0.05 ? ["正好", ""] : [`${g < 0 ? "快" : "慢"} ${Math.abs(g).toFixed(1)}`, "KG"];

// 四格数字：标签、数值、单位、小字
function cardData() {
  const s = DATA.stats;
  if (unit === "day") {
    const gap = s.gap_to_plan ?? (s.plan_weight === null ? null : s.last_weight - s.plan_weight);  // 平均还算不出时先按最新一次比
    return [
      s.avg7 === null ? ["最新体重", fmt(s.last_weight), "KG", `已记 ${s.days_logged} 天`] : ["7 天平均", fmt(s.avg7), "KG", `最新一次 ${fmt(s.last_weight)}`],
      s.change7 === null ? ["比起点", signed(s.change_from_start), "KG", "第 3 周起和上周比"] : ["本周变化", signed(s.change7, 2), "KG", `计划 ${signed(s.planned_change7, 2)}`],
      ["腰围", fmt(s.waist), s.waist === null ? "" : "CM", s.waist_change_from_start === null ? "还没量" : `比起始 ${signed(s.waist_change_from_start)}`],
      ["和计划线比", ...gapText(gap), `计划线 ${fmt(s.plan_weight)}`],
    ];
  }
  const name = unit === "week" ? "周" : "月", real = DATA.views[unit].filter((p) => !p.g);
  const ws = real.filter((p) => p.w !== null), vs = real.filter((p) => p.v !== null);
  const now = ws.at(-1), prev = ws.at(-2), v = vs.at(-1), vp = vs.at(-2);
  return [
    [`最近一${name}平均`, fmt(now.w), "KG", `这${name}记了 ${now.c} 天`],
    [`比前一${name}`, prev ? signed(now.w - prev.w, 2) : "—", prev ? "KG" : "", prev && prev.p !== null ? `计划 ${signed(now.p - prev.p, 2)}` : `下${name === "周" ? "周" : "个月"}开始能比`],
    [`这${name}腰围`, fmt(v?.v), v ? "CM" : "", !v ? "还没量" : vp ? `比前一${name} ${signed(v.v - vp.v)}` : "这段的平均"],
    ["和计划线比", ...gapText(now.p === null ? null : now.w - now.p), `计划线 ${fmt(now.p)}`],
  ];
}

function cards(delay) {
  cardData().forEach(([k, v, u, sub], i) => {
    $(`k${i + 1}`).textContent = k;
    slot($(`t${i + 1}`), v, u, delay + i * 150);
    $(`t${i + 1}s`).textContent = sub;
  });
}

function training(text) {
  const map = { 一: 0, 二: 1, 三: 2, 四: 3, 五: 4, 六: 5, 日: 6, 天: 6 }, days = Array(7).fill("");
  let hit = false;
  for (const m of (text || "").matchAll(/周([一二三四五六日天])\s*([^、，,；;\s]*)/g)) { days[map[m[1]]] = m[2] || "练"; hit = true; }
  const host = $("train");
  if (!hit) { const d = document.createElement("div"); d.className = "raw-plan"; d.textContent = text || "还没定，对 Agent 说一句"; return host.append(d); }
  const today = (new Date().getDay() + 6) % 7, box = document.createElement("div");
  box.className = "days";
  ["一", "二", "三", "四", "五", "六", "日"].forEach((name, i) => {
    const c = document.createElement("div"), label = document.createElement("i");
    c.className = "day" + (days[i] ? " on" : "") + (i === today ? " today" : "");
    c.style.setProperty("--n", i); c.textContent = name; label.textContent = days[i] || (i === today ? "今天" : "");
    c.append(label); box.append(c);
  });
  host.append(box);
}

if (DATA.empty) {
  $("nodata").hidden = false;
} else {
  const s = DATA.stats, wk = Object.fromEntries(DATA.week);
  $("app").hidden = false; $("raw").hidden = false; $("chip").hidden = !DATA.example;
  $("weekno").textContent = s.week_no ? `第 ${s.week_no} 周` : "";
  const go = s.to_go === null ? "—" : Math.max(0, s.to_go).toFixed(1), pct = s.progress_pct ?? 0;
  const togo = $("togo"), giant = togo.parentElement;
  slot(togo, go, "", 500);
  // 手机字体随机型变，放不下就按实际宽度缩，免得 KG 被切掉。字体异步加载，到位后要再量一次。留 7% 给 punch 动画的放大
  const fit = () => {
    const wide = innerWidth >= 1000, size = go.length > 3 ? (wide ? 230 : 150) : (wide ? 300 : 196);
    togo.style.setProperty("--size", size + "px");
    const kg = giant.querySelector("em"), room = (giant.clientWidth - kg.offsetWidth - parseFloat(getComputedStyle(kg).marginLeft)) * .93;
    if (togo.offsetWidth > room) togo.style.setProperty("--size", size * room / togo.offsetWidth + "px");
  };
  fit();
  document.fonts.ready.then(fit);
  $("fill").style.setProperty("--pct", pct + "%");
  $("from").textContent = `起点 ${fmt(s.start_weight)}`;
  $("pct").textContent = `已走 ${pct}%`;
  $("to").textContent = `目标 ${fmt(s.target)}`;
  if (s.change_from_start === null) $("badge").hidden = true;
  else {
    const lost = s.change_from_start <= 0;
    $("lost").textContent = signed(s.change_from_start);
    $("aroundText").textContent = (s.days_logged === 1 ? "今天开始 · 第 1 天 · " : lost ? "已经掉了 KG · " : "比起点多了 KG · ").repeat(2);
  }
  const tape = [`还差 ${go} KG`, `已走 ${pct}%`, DATA.eta ? `预计 ${DATA.eta}` : "", s.next_review ? `下次复盘 ${s.next_review}` : "", `数据截至 ${s.last_date}`].filter(Boolean).join(" ★ ") + " ★ ";
  $("tape").textContent = tape.repeat(6);
  slot($("kcal"), DATA.kcal || "—", "KCAL", 1500);
  slot($("protein"), DATA.protein || "—", "G", 1650);
  slot($("steps"), wk["每天步数"] || "—", "步", 1800);
  cards(1100);
  $("split").textContent = DATA.split === wk["力量训练"] ? "" : DATA.split;
  training(wk["力量训练"]);
  $("focus").textContent = wk["这周重点"] || "还没定";
  DATA.views.day.filter((p) => !p.g).reverse().forEach((p) => {
    const tr = document.createElement("tr");
    [p.d, p.w?.toFixed(1), p.a?.toFixed(1), p.p?.toFixed(1), p.v?.toFixed(1), p.n].forEach((v) => { const td = document.createElement("td"); td.textContent = v ?? ""; tr.append(td); });
    $("rows").append(tr);
  });
  $("openraw").addEventListener("click", () => { $("raw").open = true; });
  $("replay").addEventListener("click", () => location.reload());
  render(!STILL);
  const segs = [...document.querySelectorAll(".seg button")];
  segs.forEach((b) => b.addEventListener("click", () => {
    unit = b.dataset.unit;
    segs.forEach((x) => x.setAttribute("aria-pressed", x === b));
    cards(0);
    render(!STILL, 0);
  }));
  let frame;
  addEventListener("resize", () => { cancelAnimationFrame(frame); frame = requestAnimationFrame(() => { fit(); render(false); }); });
}
</script>
</body>
</html>
