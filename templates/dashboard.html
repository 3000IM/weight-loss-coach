<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>减肥看板</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0e0e10; --card: #17171a; --hair: #2b2b30; --grid: #242428;
  --ink: #f5f5f6; --ink2: #b0b0b8; --ink3: #85858d;
  --s-avg: #ffffff; --s-day: #8a8a92; --s-plan: #a0a0a8; --s-target: #55555c;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; -webkit-font-smoothing: antialiased; }
.page { display: grid; gap: 12px; padding: 16px 14px; grid-template-columns: minmax(0, 1fr); }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; color: var(--ink2); font-size: 14px; }
#asof { white-space: nowrap; padding-top: 2px; }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand b { color: var(--ink); font-size: 17px; font-weight: 600; }
.chip { border: 1px solid var(--hair); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--ink2); }
.card { background: var(--card); border-radius: 18px; padding: 14px 16px; min-width: 0; }
.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hero { grid-column: 1 / -1; }
.label { color: var(--ink2); font-size: 14px; }
.hero-num { font-size: 68px; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
.hero-num small { font-size: 26px; font-weight: 500; margin-left: 6px; letter-spacing: 0; color: var(--ink2); }
.sub { color: var(--ink3); font-size: 13px; margin-top: 4px; }
.value { font-size: 30px; line-height: 1.15; font-weight: 650; margin-top: 3px; letter-spacing: -0.01em; }
.value small { font-size: 15px; font-weight: 500; margin-left: 4px; color: var(--ink2); letter-spacing: 0; }
.progress { display: grid; gap: 7px; }
.bar { height: 8px; border-radius: 999px; background: var(--hair); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--ink); width: 0; }
.bar-labels { display: flex; justify-content: space-between; color: var(--ink2); font-size: 13px; }
.bar-labels b { color: var(--ink); font-weight: 600; }
figure { margin: 0; display: flex; flex-direction: column; }
figcaption { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.legend { display: flex; gap: 14px; color: var(--ink2); font-size: 12px; font-weight: 400; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.plot { position: relative; height: 290px; touch-action: pan-y; }
.waist .plot { height: 180px; }
svg { display: block; outline: none; }
svg:focus-visible { outline: 1px solid var(--ink3); outline-offset: 2px; border-radius: 4px; }
.tick { fill: var(--ink3); font-size: 12px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; top: 4px; left: 0; pointer-events: none; background: #0a0a0c; border: 1px solid var(--hair); border-radius: 10px; padding: 8px 11px; font-size: 13px; color: var(--ink2); white-space: nowrap; display: none; z-index: 2; max-width: 240px; }
.tip b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; margin-right: 6px; }
.tip div { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.tip .date { margin: 0 0 2px; color: var(--ink3); }
.tip .note { white-space: normal; color: var(--ink2); }
.key { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--s-avg); }
.key.dash { border-top: 2px dashed var(--s-plan); }
.key.dot { width: 8px; height: 8px; border: 0; border-radius: 50%; background: var(--s-day); }
.empty-plot { color: var(--ink3); font-size: 14px; display: flex; align-items: center; justify-content: center; height: 100%; }
.plan h2 { margin: 0; font-size: 15px; font-weight: 600; }
.eat { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; margin: 6px 0 8px; font-size: 26px; font-weight: 650; }
.eat small { font-size: 14px; font-weight: 500; color: var(--ink2); margin-left: 3px; }
.plan dl { margin: 0; display: grid; gap: 8px; }
.plan dt { color: var(--ink3); font-size: 13px; }
.plan dd { margin: 1px 0 0; font-size: 15px; line-height: 1.45; }
.charts, .side { display: grid; gap: 12px; min-width: 0; }
.foot { color: var(--ink3); font-size: 12px; text-align: center; }
.foot a { display: none; color: var(--ink2); margin-left: 8px; }
details { margin: 0 14px 18px; }
summary { cursor: pointer; color: var(--ink2); font-size: 14px; }
.scroll { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; font-variant-numeric: tabular-nums; }
td:last-child { white-space: normal; min-width: 120px; }
th { color: var(--ink3); font-weight: 500; }
.nodata { min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--ink2); font-size: 18px; line-height: 1.7; padding: 24px; }
.anim-draw { stroke-dasharray: 1; animation: draw 1.3s ease-out both; }
.anim-fade { animation: fade .7s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .anim-draw, .anim-fade { animation: none; } }

/* 1555×972 的内容窗口：一屏放下，字号按手机看视频时还能读清来定 */
@media (min-width: 1000px) {
  .page { padding: 20px 26px 12px; gap: 14px; height: 100vh; min-height: 720px; grid-template-rows: auto auto auto minmax(0, 1fr) auto; }
  html { scrollbar-width: none; }
  .top { font-size: 17px; align-items: center; }
  #asof { padding-top: 0; }
  .brand b { font-size: 21px; }
  .chip { font-size: 15px; padding: 2px 12px; }
  .summary { grid-template-columns: minmax(330px, 1.35fr) repeat(4, minmax(0, 1fr)); gap: 14px; }
  .hero { grid-column: auto; }
  .card { padding: 16px 20px; }
  .label { font-size: 17px; }
  .hero-num { font-size: 84px; }
  .hero-num small { font-size: 30px; }
  .value { font-size: 44px; margin-top: 8px; }
  .value small { font-size: 20px; }
  .sub { font-size: 16px; margin-top: 6px; }
  .bar { height: 10px; }
  .bar-labels { font-size: 16px; }
  .charts { grid-template-columns: minmax(0, 1fr) 420px; gap: 14px; min-height: 0; }
  .side { grid-template-rows: minmax(0, 0.8fr) minmax(0, 1fr); gap: 14px; min-height: 0; }
  figure.card { min-height: 0; }
  figcaption { font-size: 19px; }
  .legend { font-size: 15px; gap: 18px; }
  .plot, .waist .plot { flex: 1; height: auto; min-height: 0; }
  .tick { font-size: 15px; }
  .tip { font-size: 16px; padding: 10px 14px; max-width: 320px; }
  .plan { overflow: auto; }
  .plan h2 { font-size: 19px; }
  .eat { font-size: 34px; margin: 4px 0 8px; }
  .eat small { font-size: 18px; }
  .plan dt { font-size: 15px; }
  .plan dd { font-size: 18px; line-height: 1.4; }
  .plan dl { gap: 7px; }
  .foot { font-size: 14px; }
  .foot a { display: inline; }
  details { margin: 16px 26px 24px; }
  summary, table { font-size: 16px; }
}
</style>
</head>
<body>
<div id="nodata" class="nodata" hidden>还没有数据。<br>对你的 Agent 说「开始减肥计划」，走完问答再回来看。</div>
<main id="app" class="page" hidden>
  <header class="top">
    <div class="brand"><b>减肥看板</b><span id="weekno"></span><span id="chip" class="chip" hidden>示例数据，全部是编的</span></div>
    <div id="asof"></div>
  </header>

  <section class="summary">
    <div class="card hero">
      <div class="label">离目标还差</div>
      <div class="hero-num"><span id="togo"></span><small>kg</small></div>
    </div>
    <div class="card"><div class="label">7 天平均</div><div class="value" id="t1"></div><div class="sub" id="t1s"></div></div>
    <div class="card"><div class="label">本周变化</div><div class="value" id="t2"></div><div class="sub" id="t2s"></div></div>
    <div class="card"><div class="label">腰围</div><div class="value" id="t3"></div><div class="sub" id="t3s"></div></div>
    <div class="card"><div class="label">和计划线比</div><div class="value" id="t4"></div><div class="sub" id="t4s"></div></div>
  </section>

  <section class="progress" aria-label="进度">
    <div class="bar"><i id="fill"></i></div>
    <div class="bar-labels"><span id="b1"></span><b id="b2"></b><span id="b3"></span></div>
  </section>

  <section class="charts">
    <figure class="card">
      <figcaption>体重 kg
        <span class="legend"><span><i class="key dot"></i>每天</span><span><i class="key"></i>7 天平均</span><span><i class="key dash"></i>计划线</span></span>
      </figcaption>
      <div class="plot" id="weight"></div>
    </figure>
    <div class="side">
      <figure class="card waist">
        <figcaption>腰围 cm</figcaption>
        <div class="plot" id="waist"></div>
      </figure>
      <section class="card plan">
        <h2>本周计划</h2>
        <div class="eat"><span id="kcal"></span><span id="protein"></span></div>
        <dl id="week"></dl>
      </section>
    </div>
  </section>

  <footer class="foot">AI 判断不准，不是医疗建议。数据只存在你自己的电脑上。<a id="openraw" href="#raw">看每天的原始数据</a></footer>
</main>
<details id="raw" hidden>
  <summary>看每天的原始数据</summary>
  <div class="scroll"><table><thead><tr><th>日期</th><th>体重</th><th>7 天平均</th><th>计划线</th><th>腰围</th><th>备注</th></tr></thead><tbody id="rows"></tbody></table></div>
</details>

<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const dayNo = (s) => Date.parse(s + "T00:00:00Z") / 864e5;
const signed = (x, n = 1) => x === null || x === undefined ? "" : (x < 0 ? "−" : x > 0 ? "+" : "") + Math.abs(x).toFixed(n);
const md = (s) => s.slice(5).replace(/^0/, "").replace("-0", "/").replace("-", "/");
const WEEK = "日一二三四五六";
const setValue = (el, value, unit) => {
  el.textContent = value;
  if (unit) { const small = document.createElement("small"); small.textContent = unit; el.appendChild(small); }
};

function niceStep(range, maxTicks) {
  for (const s of [0.5, 1, 2, 5, 10, 20, 50]) if (range / s <= maxTicks) return s;
  return 100;
}

// 一张折线图。series 只放数字和日期，用户写的备注只经 textContent 进页面。
function lineChart(host, cfg, animate) {
  const W = host.clientWidth, H = host.clientHeight, big = innerWidth >= 1000;
  const m = { l: big ? 48 : 38, r: big ? 66 : 48, t: 10, b: big ? 28 : 24 };
  const pts = cfg.points;
  if (pts.length < 2) {
    const note = document.createElement("div");
    note.className = "empty-plot"; note.textContent = cfg.emptyText;
    host.replaceChildren(note);
    return;
  }
  const x0 = dayNo(pts[0].d), x1 = dayNo(pts[pts.length - 1].d);
  const X = (d) => m.l + (dayNo(d) - x0) / Math.max(1, x1 - x0) * (W - m.l - m.r);
  const all = pts.flatMap((p) => [p.y, p.a, p.p]).filter((v) => v !== null && v !== undefined);
  const spread = Math.max(...all) - Math.min(...all);
  const targetNear = cfg.target !== undefined && cfg.target >= Math.min(...all) - Math.max(spread, 1) * 0.6;
  if (targetNear) all.push(cfg.target);
  const step = Math.max(niceStep(Math.max(...all) - Math.min(...all), big ? 7 : 5), cfg.minStep || 0);
  const lo = Math.floor((Math.min(...all) - step * 0.25) / step) * step;
  const hi = Math.ceil((Math.max(...all) + step * 0.25) / step) * step;
  const Y = (v) => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);

  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += step) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/>`;
    g += `<text class="tick" x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${+v.toFixed(1)}</text>`;
  }
  const span = x1 - x0, minGap = 52;
  let every = 7;
  while (every / Math.max(1, span) * (W - m.l - m.r) < minGap && every < span) every *= 2;
  for (let n = 0; n <= span; n += every) {
    const d = new Date((x0 + n) * 864e5).toISOString().slice(0, 10);
    g += `<text class="tick" x="${X(d)}" y="${H - 6}" text-anchor="middle">${md(d)}</text>`;
  }
  if (cfg.target !== undefined && !targetNear) {
    g += `<text class="tick" style="fill:var(--ink2)" x="${m.l + 8}" y="${H - m.b - 8}">↓ 目标 ${cfg.target.toFixed(1)}</text>`;
  }
  if (targetNear) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(cfg.target)}" y2="${Y(cfg.target)}" stroke="var(--s-target)" stroke-width="1.5"/>`;
    g += `<text class="tick" style="fill:var(--ink2)" x="${m.l + 8}" y="${Y(cfg.target) - 7}">目标 ${cfg.target.toFixed(1)}</text>`;
  }

  const path = (key) => pts.filter((p) => p[key] !== null && p[key] !== undefined).map((p, i) => `${i ? "L" : "M"}${X(p.d).toFixed(1)} ${Y(p[key]).toFixed(1)}`).join("");
  const draw = animate ? ' class="anim-draw" pathLength="1"' : "";
  const fade = animate ? ' class="anim-fade"' : "";
  const lineKey = cfg.lineKey;
  const withLine = pts.filter((p) => p[lineKey] !== null && p[lineKey] !== undefined);

  if (cfg.area && withLine.length > 1) {
    const base = Y(lo), id = "wash" + host.id;
    g += `<defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>`;
    g += `<path${fade} d="${path(lineKey)}L${X(withLine[withLine.length - 1].d)} ${base}L${X(withLine[0].d)} ${base}Z" fill="url(#${id})"/>`;
  }
  if (cfg.plan) g += `<path${fade} d="${path("p")}" fill="none" stroke="var(--s-plan)" stroke-width="${big ? 2 : 1.5}" stroke-dasharray="6 6"/>`;
  if (cfg.dots) {
    const r = (W - m.l - m.r) / Math.max(1, span) < 9 ? 2.5 : big ? 5 : 4;
    pts.forEach((p) => {
      if (p.y !== null && p.y !== undefined) g += `<circle${fade} cx="${X(p.d)}" cy="${Y(p.y)}" r="${r}" fill="${cfg.dotFill || "var(--s-day)"}" stroke="var(--card)" stroke-width="2"/>`;
    });
  }
  g += `<path${draw} d="${path(lineKey)}" fill="none" stroke="var(--s-avg)" stroke-width="${big ? 3 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
  const end = withLine[withLine.length - 1];
  if (end) {
    g += `<circle${fade} cx="${X(end.d)}" cy="${Y(end[lineKey])}" r="5.5" fill="var(--s-avg)" stroke="var(--card)" stroke-width="2"/>`;
    g += `<text${fade} x="${X(end.d) + 11}" y="${Y(end[lineKey]) + 6}" fill="var(--ink)" font-weight="700" font-size="${big ? 19 : 14}">${end[lineKey].toFixed(1)}</text>`;
  }
  g += `<line id="${host.id}-cross" y1="${m.t}" y2="${H - m.b}" stroke="var(--ink3)" visibility="hidden"/>`;
  g += `<circle id="${host.id}-mark" r="6" fill="var(--s-avg)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`;

  host.innerHTML = `<svg width="${W}" height="${H}" tabindex="0" role="img" aria-label="${cfg.aria}">${g}</svg><div class="tip"></div>`;
  const svg = host.querySelector("svg"), tip = host.querySelector(".tip");
  const cross = svg.querySelector(`[id="${host.id}-cross"]`), mark = svg.querySelector(`[id="${host.id}-mark"]`);
  let current = pts.length - 1;

  function row(text, name, keyClass) {
    const div = document.createElement("div"), b = document.createElement("b"), key = document.createElement("i"), label = document.createElement("span");
    b.textContent = text; key.className = "key " + keyClass; label.textContent = name;
    div.append(key, b, label);
    return div;
  }
  function show(i) {
    current = i;
    const p = pts[i], px = X(p.d);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    const markValue = p[lineKey] ?? p.y;
    if (markValue !== null && markValue !== undefined) {
      mark.setAttribute("cx", px); mark.setAttribute("cy", Y(markValue)); mark.setAttribute("visibility", "visible");
    } else mark.setAttribute("visibility", "hidden");
    const date = document.createElement("div");
    date.className = "date";
    date.textContent = `${md(p.d)} 周${WEEK[new Date(p.d + "T00:00:00Z").getUTCDay()]}`;
    tip.replaceChildren(date);
    cfg.rows.forEach(([key, name, cls]) => { if (p[key] !== null && p[key] !== undefined) tip.append(row(p[key].toFixed(1), name, cls)); });
    if (p.n) { const note = document.createElement("div"); note.className = "note"; note.textContent = p.n; tip.append(note); }
    tip.style.display = "block";
    const w = tip.offsetWidth;
    tip.style.left = (px + 14 + w > W ? Math.max(0, px - w - 14) : px + 14) + "px";
  }
  function hide() { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); mark.setAttribute("visibility", "hidden"); }
  function nearest(ev) {
    const px = ev.clientX - svg.getBoundingClientRect().left;
    let best = 0, dist = Infinity;
    pts.forEach((p, i) => { const d = Math.abs(X(p.d) - px); if (d < dist) { dist = d; best = i; } });
    show(best);
  }
  svg.addEventListener("pointermove", nearest);
  svg.addEventListener("pointerdown", nearest);
  svg.addEventListener("pointerleave", hide);
  svg.addEventListener("focus", () => show(current));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", (ev) => {
    if (ev.key === "ArrowLeft") show(Math.max(0, current - 1));
    if (ev.key === "ArrowRight") show(Math.min(pts.length - 1, current + 1));
  });
}

function render(animate) {
  const s = DATA.stats;
  lineChart($("weight"), {
    points: DATA.points.filter((p) => p.w !== null).map((p) => ({ ...p, y: p.w })),
    lineKey: "a", dots: true, plan: true, area: true, target: s.target,
    aria: `体重曲线，7 天平均 ${s.avg7 ?? "暂无"} kg，目标 ${s.target} kg。每天的数值见页面底部表格。`,
    rows: [["a", "7 天平均", ""], ["y", "当天", "dot"], ["p", "计划线", "dash"]],
    emptyText: "记满两天后这里出曲线",
  }, animate);
  lineChart($("waist"), {
    points: DATA.points.filter((p) => p.v !== null).map((p) => ({ ...p, y: p.v, a: null, p: null })),
    lineKey: "y", dots: true, dotFill: "var(--s-avg)", minStep: 1,
    aria: `腰围曲线，最新 ${s.waist ?? "暂无"} cm。每次的数值见页面底部表格。`,
    rows: [["y", "腰围", ""]],
    emptyText: "量过两次腰围后这里出曲线",
  }, animate);
}

if (DATA.empty) {
  $("nodata").hidden = false;
} else {
  const s = DATA.stats;
  $("app").hidden = false; $("raw").hidden = false; $("chip").hidden = !DATA.example;
  $("weekno").textContent = s.week_no ? `第 ${s.week_no} 周` : "";
  $("asof").textContent = `数据截至 ${s.last_date}`;
  $("togo").textContent = s.to_go === null ? "—" : Math.max(0, s.to_go).toFixed(1);
  setValue($("t1"), s.avg7 === null ? "—" : s.avg7.toFixed(1), s.avg7 === null ? "" : "kg");
  $("t1s").textContent = s.avg7 === null ? "记满 3 天后出现" : `最新一次 ${s.last_weight.toFixed(1)}`;
  setValue($("t2"), s.change7 === null ? "—" : signed(s.change7, 2), s.change7 === null ? "" : "kg");
  $("t2s").textContent = s.change7 === null ? "记满两周后出现" : `计划 ${signed(s.planned_change7, 2)}`;
  setValue($("t3"), s.waist === null ? "—" : s.waist.toFixed(1), s.waist === null ? "" : "cm");
  $("t3s").textContent = s.waist_change_from_start === null ? "还没量" : `比起始 ${signed(s.waist_change_from_start)}`;
  if (s.gap_to_plan === null) { $("t4").textContent = "—"; $("t4s").textContent = "记满 3 天后出现"; }
  else {
    const g = s.gap_to_plan, close = Math.abs(g) < 0.05;
    setValue($("t4"), close ? "正好" : `${g < 0 ? "快" : "慢"} ${Math.abs(g).toFixed(1)}`, close ? "" : "kg");
    $("t4s").textContent = `计划线 ${s.plan_weight.toFixed(1)}`;
  }
  $("fill").style.width = (s.progress_pct ?? 0) + "%";
  $("b1").textContent = `起点 ${s.start_weight.toFixed(1)} kg`;
  $("b2").textContent = `已走 ${s.progress_pct ?? 0}%`;
  $("b3").textContent = `目标 ${s.target.toFixed(1)} kg${DATA.eta ? " · 预计 " + DATA.eta : ""}`;
  setValue($("kcal"), DATA.kcal, "kcal");
  setValue($("protein"), "蛋白 " + DATA.protein, "g");
  DATA.week.forEach(([k, v]) => {
    const dt = document.createElement("dt"), dd = document.createElement("dd"), wrap = document.createElement("div");
    dt.textContent = k; dd.textContent = v; wrap.append(dt, dd); $("week").append(wrap);
  });
  [...DATA.points].reverse().forEach((p) => {
    const tr = document.createElement("tr");
    [p.d, p.w?.toFixed(1), p.a?.toFixed(1), p.p?.toFixed(1), p.v?.toFixed(1), p.n].forEach((v) => {
      const td = document.createElement("td"); td.textContent = v ?? ""; tr.append(td);
    });
    $("rows").append(tr);
  });
  $("openraw").addEventListener("click", () => { $("raw").open = true; });
  render(true);
  let frame;
  addEventListener("resize", () => { cancelAnimationFrame(frame); frame = requestAnimationFrame(() => render(false)); });
}
</script>
</body>
</html>
