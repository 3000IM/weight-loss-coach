{"imports":{

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';
const MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const Q=new URLSearchParams(location.search);
const NUM=(k,d)=>Q.has(k)?+Q.get(k):d;
const DENSITY=NUM('n',.8), DIM=NUM('dim',.92);                 // 粒子倍数、人像亮度
const PIN=NUM('pin',.28), ROT=NUM('rot',1), HIT=NUM('hit',.5); // 捏合多近算捏住、旋转灵敏度、抓线半径（0 = 不抓线）
const HOLD=NUM('hold',.8), EDGE=NUM('edge',.5), STILL=NUM('still',1.2); // 张手和握拳：停多久、离画面边缘多远、多慢算停住
const FC=NUM('fc',1.5), BETA=NUM('beta',2), FOLLOW=NUM('follow',35);    // 跟手：1€ 滤波的两个参数、视图追手的速度
const SWIPE=NUM('swipe',8), NEAR=NUM('near',2.5), SWEEP=NUM('sweep',1.5); // 双手唰开、合拢：间距变化多快（手掌长/秒）、多近算并拢（手掌长）、至少变化多少（手掌长）
const $=id=>document.getElementById(id), stage=$('stage'), video=$('cam'), hud=$('hud'), hx=hud.getContext('2d');
const TAU=Math.PI*2, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const CY='#39e6ff', AM='#ffb02e', PK='#ff5ad1', GR='#7dffc2', WH_='#eaf8ff', BL='#8fc4ff';
const SANS='"Helvetica Neue","PingFang SC",sans-serif', MONO='"SF Mono",Menlo,"PingFang SC",monospace';

// ---------- 数据：show.py 给的是你自己的 log.md 和 plan.md；没有就用下面这份编的示例（同 examples/three-weeks）。算法同 coach.py
const SAMPLE={label:'SAMPLE DATA 示例数据',plan:{start:82.0,waist0:94.0,goal:75.0,rate:.44,kcal:1950,protein:'120–150',lineDay:'2026-10-12',lineKg:82.0,week:3,pace:'on_track'},log:[
  ['2026-10-12',82.0,94.0,'第一天'],['2026-10-13',81.6],['2026-10-14',81.7],['2026-10-15',81.2],['2026-10-16',81.3],
  ['2026-10-17',81.0],['2026-10-18',80.9,93.2],['2026-10-19',80.9],['2026-10-20',81.0,null,'昨晚练腿'],['2026-10-21',81.2,null,'腿还酸'],
  ['2026-10-23',81.8,null,'昨晚火锅'],['2026-10-24',81.4],['2026-10-25',81.0,92.6],['2026-10-26',80.9],['2026-10-27',80.9],
  ['2026-10-28',80.6],['2026-10-29',80.7],['2026-10-31',80.4],['2026-11-01',80.4,91.8],
]};
const {log:LOG,plan:PLAN,label:DATA_LABEL}=window.COACH_DATA||SAMPLE;
const dayOf=s=>Date.parse(s+'T00:00Z')/864e5;
const all=LOG.map(([date,kg,waist,note])=>({date,kg,waist,note:note||''})), rows=all.filter(r=>r.kg!=null);
for(const r of rows)r.t=dayOf(r.date)-dayOf(rows[0].date);
for(const r of rows){const w=rows.filter(q=>q.t>r.t-7&&q.t<=r.t);r.avg=w.length>=3?w.reduce((s,q)=>s+q.kg,0)/w.length:null}
const lineT=PLAN.lineDay?dayOf(PLAN.lineDay)-dayOf(rows[0].date):0;
const planAt=t=>PLAN.rate&&PLAN.lineKg?Math.max(PLAN.goal,PLAN.lineKg-PLAN.rate*Math.max(0,t-lineT-3)/7):null; // 计划线后移 3 天，和 7 天平均才可比
const last=rows.at(-1), TN=last.t, lost=Math.max(0,PLAN.start-last.kg), toGoal=Math.max(0,last.kg-PLAN.goal), pct=clamp(lost/(PLAN.start-PLAN.goal),0,1);
const waists=all.filter(r=>r.waist!=null), waistNow=waists.at(-1)?.waist, waist0=PLAN.waist0??waists[0]?.waist;

// ---------- 手势：不分左右手，手转到什么角度都成立
const spread=q=>{let mx=0,my=0,s=0;for(const p of q){mx+=p.x/q.length;my+=p.y/q.length}for(const p of q)s+=(p.x-mx)**2+(p.y-my)**2;return Math.sqrt(s)};
// w 是手的 3D 真实尺寸，p 是画面坐标。MediaPipe 的 3D 深度很飘（真捏合的照片读出 0.71），
// 所以捏合只看画面里两指尖的距离，再按手的真实大小换算成占手掌长度的比例（实测捏合 .10–.19，张开手 .37 以上）。
const gapOf=(w,p)=>Math.hypot(p[4].x-p[8].x,p[4].y-p[8].y)*spread(w)/spread(p)/Math.hypot(w[0].x-w[9].x,w[0].y-w[9].y,w[0].z-w[9].z);
// closed=这只手现在是捏着的：松开的门槛放宽一点，指尖抖动不会来回跳。
function classify(w,p=w,closed=false){
  const d=(a,b)=>Math.hypot(w[a].x-w[b].x,w[a].y-w[b].y,w[a].z-w[b].z);
  const ext=tip=>d(tip,0)>d(tip-2,0)*1.1;
  // 捏：两指尖靠近就算，其他三指随意（比 OK 也是捏）。只排除握拳：握拳时拇指也压在食指上，但食指尖缩回到指根里面（实测握拳 .86，OK 1.07，捏住 1.45）
  if(gapOf(w,p)<(closed?PIN*1.3:PIN)&&d(8,0)>d(5,0)*(closed?.9:.96))return 'pinch';
  const n=[8,12,16,20].filter(ext).length;
  return n===4?'open':n===0&&[8,12,16,20].every(t=>d(t,0)<d(t-3,0)*1.1)?'fist':'none'; // 刚松开时手指半弯，不能算握拳
}
// 1€ 滤波（Casiez 2012）：手慢时压抖，手快时不拖。截止频率 = FC + BETA × 速度（世界单位/秒，画面高 = 10）
function euro(f,x,dt){
  if(f.x===undefined){f.x=x;f.dx=0;return x}
  const a=fc=>{const r=TAU*fc*dt;return r/(r+1)};
  f.dx+=a(1)*((x-f.x)/dt-f.dx);
  return f.x+=a(FC+BETA*Math.abs(f.dx))*(x-f.x);
}

// ---------- 舞台：世界坐标高 10，宽按 1555:972
const A=1555/972, WH=10, WW=WH*A, PPU=240;
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),powerPreference:'high-performance'});
renderer.setClearColor(0,1);
const scene=new THREE.Scene(), cam3=new THREE.PerspectiveCamera(40,A,.1,100);
cam3.position.z=(WH/2)/Math.tan(THREE.MathUtils.degToRad(20));cam3.updateMatrixWorld();
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,cam3));
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.3,.4,.5);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const U={uTime:{value:0},uMorph:{value:0},uPx:{value:30},uOrigin:{value:new THREE.Vector3(0,0,0)},
  uTouch:{value:[0,1,2,3].map(()=>new THREE.Vector3(1e3,1e3,0))},uTouchAmp:{value:0},uScan:{value:new THREE.Vector4()},uScanOn:{value:0}};
const pointsMat=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,
vertexShader:`
uniform float uTime,uMorph,uPx,uTouchAmp,uScanOn; uniform vec3 uOrigin; uniform vec3 uTouch[4]; uniform vec4 uScan;
attribute vec3 aHome,aColor; attribute vec4 aSeed; // x 出场先后 y 大小 z 相位 w 随机
varying vec3 vC; varying float vA;
vec3 flow(vec3 p,float t){return vec3(sin(p.y*1.3+t)+.6*sin(p.z*2.1-t*.7),sin(p.z*1.1+t*1.1)+.6*sin(p.x*1.9+t*.6),sin(p.x*1.2-t*.9)+.6*sin(p.y*2.3+t*.4));}
void main(){
  float d=aSeed.x;
  float th=aHome.y+uTime*(.06+.5/aHome.x);
  vec3 ga=vec3(cos(th)*aHome.x,aHome.z,sin(th)*aHome.x);
  vec3 idle=vec3(ga.x,ga.y*.42-ga.z*.91,ga.y*.91+ga.z*.42)+flow(ga*.35+aSeed.z*6.28,uTime*.3+aSeed.w*6.)*.28;
  vec3 tgt=(modelMatrix*vec4(position,1.)).xyz;
  float p1=smoothstep(d*.2,d*.2+.25,uMorph);            // 待机 -> 手心
  float p2=smoothstep(.45+d*.25,.75+d*.25,uMorph);      // 手心 -> 数据
  float ang=aSeed.z*6.283+uTime*(3.+aSeed.w*4.);
  float rad=.12+aSeed.y*.6+.22*sin(uTime*2.+aSeed.z*9.);
  vec3 orb=uOrigin+vec3(cos(ang)*rad,sin(ang)*rad,sin(ang*2.)*rad*.5);
  vec3 pos=mix(mix(idle,orb,p1),tgt,p2);
  float fly=sin(3.1416*p2);
  pos+=flow(tgt*.9+aSeed.z*6.28,uTime*.9)*fly*.88;
  float hit=0.;
  for(int i=0;i<4;i++){vec2 v=pos.xy-uTouch[i].xy;float g=exp(-dot(v,v)*1.6)*uTouchAmp;pos.xy+=normalize(v+1e-4)*g*.55;hit+=g;}
  float s=dot(tgt,uScan.xyz)+uScan.w; float sg=exp(-s*s*30.)*uScanOn;
  float pulse=pow(.5+.5*sin(tgt.x*1.7+tgt.y*.7-uTime*2.4),14.);
  vec3 idleC=mix(vec3(.3,.95,1.),vec3(.55,.35,1.),clamp((aHome.x-2.5)/6.5,0.,1.))*(1.+.8*pow(aSeed.w,6.));
  vC=mix(idleC,aColor,p2)*(1.+p2*pulse*1.2+hit*1.2+sg*4.)+vec3(fly*.16);
  float idleA=step(aSeed.y,.3)*.95*(1.-p2);
  vA=max(idleA,mix(p1*.8,.42,p2)+sg*.5)*mix(.75+.25*sin(uTime*3.+aSeed.z*40.),1.,p2);
  vec4 mv=viewMatrix*vec4(pos,1.);
  gl_Position=projectionMatrix*mv;
  gl_PointSize=max(1.5,uPx*.62*(.8+aSeed.y*.6)*(1.+fly*.96+sg)/-mv.z);
}`,
fragmentShader:`
varying vec3 vC; varying float vA;
void main(){gl_FragColor=vec4(vC,smoothstep(.5,.32,length(gl_PointCoord-.5))*vA);}`});

// 所有形状都用 2D 画布画，再把画到的像素采样成粒子；clear 层再贴一张同样的图保证字清楚
const crispMats=[];
function layer(parent,{w,h,n,draw,pos=[0,0,0],rot=[0,0,0],jz=.05,crisp=true}){
  const cv=document.createElement('canvas');cv.width=w*PPU;cv.height=h*PPU;
  const c=cv.getContext('2d',{willReadFrequently:true});draw(c,cv.width,cv.height);
  c.setTransform(1,0,0,1,0,0);
  const {data}=c.getImageData(0,0,cv.width,cv.height), ink=[];
  for(let o=3;o<data.length;o+=4)if(data[o]>8)ink.push(o-3);
  n=ink.length?Math.round(n*DENSITY):0;
  const P=new Float32Array(n*3),H=new Float32Array(n*3),C=new Float32Array(n*3),D=new Float32Array(n*4);
  for(let i=0;i<n;){
    const o=ink[Math.random()*ink.length|0];
    if(Math.random()*255>data[o+3])continue;
    const px=(o/4)%cv.width, py=(o/4/cv.width)|0;
    P.set([(px+Math.random())/PPU-w/2,h/2-(py+Math.random())/PPU,(Math.random()-.5)*jz],i*3);
    const gr=(Math.random()+Math.random())/2*2-1, ring=2.5+Math.random()**.6*6.5; // 半径、三条旋臂的角度、厚度
    H.set([ring,(Math.random()*3|0)*TAU/3+ring*.55+gr*.7,gr*(.25+Math.random()*.9)],i*3);
    C.set([(data[o]/255)**2.2,(data[o+1]/255)**2.2,(data[o+2]/255)**2.2],i*3);
    D.set([.55*Math.random()+.45*px/cv.width,Math.random(),Math.random(),Math.random()],i*4);
    i++;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(P,3));geo.setAttribute('aHome',new THREE.BufferAttribute(H,3));
  geo.setAttribute('aColor',new THREE.BufferAttribute(C,3));geo.setAttribute('aSeed',new THREE.BufferAttribute(D,4));
  const g=new THREE.Group();g.position.set(...pos);g.rotation.set(...rot);parent.add(g);
  const pts=new THREE.Points(geo,pointsMat);pts.frustumCulled=false;g.add(pts);
  if(crisp){
    const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
    const m=new THREE.MeshBasicMaterial({map:t,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false,opacity:0});
    g.add(new THREE.Mesh(new THREE.PlaneGeometry(w,h),m));crispMats.push(m);
  }
  return g;
}
const T=(c,s,x,y,size,color,{w=700,a='left',f=SANS,sp=0}={})=>{c.font=`${w} ${size}px ${f}`;c.textAlign=a;c.fillStyle=color;c.letterSpacing=sp+'px';c.fillText(s,x,y);const m=c.measureText(s).width;c.letterSpacing='0px';return m};
const L=(c,pts,color,lw,dash=[])=>{c.strokeStyle=color;c.lineWidth=lw;c.lineJoin='round';c.lineCap='round';c.setLineDash(dash);c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();c.setLineDash([])};
const arc=(c,r,a0,a1,color,lw,dash=[])=>{c.strokeStyle=color;c.lineWidth=lw;c.lineCap='butt';c.setLineDash(dash);c.beginPath();c.arc(0,0,r,a0,a1);c.stroke();c.setLineDash([])};

// ---------- 全息体：中间体重曲线，左翼离目标差，右翼腰围和每日目标
const holo=new THREE.Group();holo.rotation.order='YXZ';scene.add(holo);
const kgs=rows.flatMap(r=>[r.kg,planAt(r.t)??r.kg]), kgSpan=Math.max(1,Math.max(...kgs)-Math.min(...kgs)), yLo=Math.min(...kgs)-kgSpan*.3, yHi=Math.max(...kgs)+kgSpan*.25;
const kgStep=[1,2,5,10,20,50].find(s=>(yHi-yLo)/s<=5), tStep=7*Math.ceil(TN/28), tTicks=[];
for(let t=0;t<TN-tStep/3;t+=tStep)tTicks.push(t);tTicks.push(TN);
const X=t=>150+t/TN*1600, Y=kg=>980-(kg-yLo)/(yHi-yLo)*800;
const local=(px,py)=>new THREE.Vector3(px/PPU-4,2.25-py/PPU,0);
const curve=rows.map(r=>[X(r.t),Y(r.kg)]);

layer(holo,{w:8,h:3.2,n:9000,pos:[0,-2.35,.2],rot:[-Math.PI/2,0,0],draw:(c,w,h)=>{
  for(let x=0;x<=w;x+=120)L(c,[[x,0],[x,h]],'rgba(70,150,255,.55)',2);
  for(let y=0;y<=h;y+=96)L(c,[[0,y],[w,y]],'rgba(70,150,255,.55)',2);
  c.globalCompositeOperation='destination-in';
  const g=c.createRadialGradient(w/2,h/2,80,w/2,h/2,w/2);g.addColorStop(0,'#000');g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,w,h);
}});
layer(holo,{w:8,h:4.5,n:15000,pos:[0,0,-.7],draw:c=>{
  for(let kg=Math.ceil(yLo/kgStep)*kgStep;kg<=yHi;kg+=kgStep){L(c,[[150,Y(kg)],[1750,Y(kg)]],'rgba(110,170,255,.5)',2,[4,10]);T(c,kg,130,Y(kg)+13,38,BL,{a:'right',f:MONO})}
  for(const t of tTicks){L(c,[[X(t),180],[X(t),980]],'rgba(110,170,255,.32)',2);T(c,rows.find(r=>r.t>=t).date.slice(5),X(t),1036,38,BL,{a:'center',f:MONO})}
  const m=T(c,'WEIGHT',150,104,74,WH_,{w:800,sp:6});T(c,'体重 · kg',150+m+22,104,40,BL);
  const [paceEn,paceCn]={on_track:['ON TRACK','正常'],fast:['FAST','偏快'],slow:['SLOW','偏慢']}[PLAN.pace]||[];
  T(c,`WEEK ${PLAN.week}${paceEn?' · '+paceEn:''}  第 ${PLAN.week} 周${paceCn?' · '+paceCn:''}`,150,156,34,'#7dffc2',{f:MONO,w:600});
  L(c,[[1020,92],[1070,92]],CY,7);T(c,'DAILY 每日',1082,104,34,CY,{w:600});
  L(c,[[1300,92],[1350,92]],AM,10);T(c,'7-DAY AVG 7天平均',1362,104,34,AM,{w:600});
  L(c,[[1020,146],[1070,146]],'#dfe9ff',4,[10,10]);T(c,'PLAN 计划线',1082,158,34,'#dfe9ff',{w:600});
  for(const [x,y,dx,dy] of [[20,20,1,1],[1900,20,-1,1],[20,1060,1,-1],[1900,1060,-1,-1]])L(c,[[x+dx*70,y],[x,y],[x,y+dy*70]],CY,5);
}});
layer(holo,{w:8,h:4.5,n:6000,pos:[0,0,-.35],draw:c=>PLAN.rate&&L(c,rows.map(r=>[X(r.t),Y(planAt(r.t))]),'#dfe9ff',4,[12,14])});
layer(holo,{w:8,h:4.5,n:22000,jz:.4,crisp:false,draw:c=>{
  c.beginPath();curve.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.lineTo(X(TN),980);c.lineTo(X(0),980);c.closePath();
  const g=c.createLinearGradient(0,250,0,980);g.addColorStop(0,'rgba(57,230,255,.75)');g.addColorStop(1,'rgba(57,120,255,.03)');c.fillStyle=g;c.fill();
}});
layer(holo,{w:8,h:4.5,n:28000,draw:c=>{
  L(c,curve,CY,7);
  for(const [x,y] of curve){c.fillStyle=CY;c.beginPath();c.arc(x,y,11,0,TAU);c.fill()}
  T(c,rows[0].kg.toFixed(1),X(0)+6,Y(rows[0].kg)-28,56,WH_,{f:MONO});
  const jump=r=>{const i=rows.indexOf(r);return r.kg-rows[i-1].kg};
  const hot=rows.filter((r,i)=>i&&r.note).sort((a,b)=>jump(b)-jump(a))[0]; // 标出涨得最多、又写了备注的那天
  if(hot){T(c,hot.kg.toFixed(1),X(hot.t),Y(hot.kg)-66,56,WH_,{a:'center',f:MONO});T(c,hot.note.slice(0,10),X(hot.t),Y(hot.kg)-24,34,'#ffd9a0',{a:'center',w:600})}
  T(c,last.kg.toFixed(1),X(TN),Y(last.kg)+76,72,WH_,{a:'right',f:MONO,w:800});
}});
layer(holo,{w:8,h:4.5,n:20000,pos:[0,0,.35],draw:c=>L(c,rows.filter(r=>r.avg).map(r=>[X(r.t),Y(r.avg)]),AM,12)});

const left=new THREE.Group();left.position.set(-6.15,.05,.5);left.rotation.y=.52;holo.add(left);
const spinA=layer(left,{w:4.2,h:4.2,n:8000,draw:(c,w,h)=>{c.translate(w/2,h/2);const R=w*.47;
  for(let i=0;i<72;i++){const a=i/72*TAU,r=i%6?R-14:R-40;L(c,[[Math.cos(a)*R,Math.sin(a)*R],[Math.cos(a)*r,Math.sin(a)*r]],CY,i%6?3:7)}}});
const spinB=layer(left,{w:4.2,h:4.2,n:5000,draw:(c,w,h)=>{c.translate(w/2,h/2);arc(c,w*.32,0,TAU,PK,6,[46,30]);arc(c,w*.3,.4,2.2,'#ff9ae6',3)}});
layer(left,{w:4.2,h:4.2,n:13000,draw:(c,w,h)=>{c.save();c.translate(w/2,h/2);
  arc(c,w*.385,0,TAU,'rgba(255,176,46,.22)',26);arc(c,w*.385,-Math.PI/2,-Math.PI/2+pct*TAU,AM,26);c.restore();
