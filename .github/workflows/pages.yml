# 只把 showcase/ 发到 GitHub Pages
name: pages
on:
  push:
    branches: [main]
    paths: [showcase/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/configure-pages@v5
        timeout-minutes: 5
      - uses: actions/upload-pages-artifact@v3
        timeout-minutes: 5
        with:
          path: showcase
      - id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 10
